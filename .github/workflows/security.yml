name: Security checks

on:
  pull_request:
    paths:
      - "calculadora-nutricional/**"
      - ".github/workflows/security.yml"
  push:
    branches: [main]
    paths:
      - "calculadora-nutricional/**"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    env:
      # Prisma schema validation only needs valid URL-shaped values; CI must
      # never connect to a real database.
      POSTGRES_PRISMA_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
      POSTGRES_URL_NON_POOLING: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
      # Build-time auth validation only; never use this value outside CI.
      NEXTAUTH_SECRET: ci-only-secret-with-more-than-32-characters
    defaults:
      run:
        working-directory: calculadora-nutricional
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: calculadora-nutricional/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx prisma generate --schema=./prisma/schema.prisma
      - run: npm run security:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx prisma validate --schema=./prisma/schema.prisma
      - run: npm run build
