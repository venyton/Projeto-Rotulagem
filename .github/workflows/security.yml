name: Security checks

on:
  pull_request:
    paths:
      - "calculadora-nutricional/**"
      - ".github/workflows/security.yml"
  push:
    branches: [main]
    paths:
      - "calculadora-nutricional/**"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calculadora-nutricional
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: calculadora-nutricional/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx prisma generate --schema=./prisma/schema.prisma
      - run: npm run security:check
      - run: npm run lint
      - run: npx tsc --noEmit
